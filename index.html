<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Meja Produksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tata letak: bilah atas + tab peran, isi satu kolom lebar 1180px. Warna stasiun mengambil tinta CMYK: cetak=cyan, potong=magenta, lem=kuning. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#F4F5F8; --ink:#141A24; --muted:#586374; --line:#D6DBE2;
  --accent:#1D2F6F; --on-accent:#FFFFFF;
  --cetak:#0A8FB8; --potong:#C0307A; --lem:#E0A800;
  --on-cetak:#FFFFFF; --on-potong:#FFFFFF; --on-lem:#2A2100; --lipat:#4A5568; --on-lipat:#FFFFFF;
  --ok:#1B7F52; --warn:#9A6200; --bad:#BE2F2F; --okbg:#E1F3EA; --warnbg:#FBF0D8; --badbg:#FBE4E4;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161C25; --surface2:#1C2430; --ink:#E7EBF1; --muted:#9AA5B5; --line:#2B3441;
  --accent:#93A9FF; --on-accent:#0E1218;
  --cetak:#3CC0E8; --potong:#F06BAA; --lem:#F2C230; --on-cetak:#0E1218; --on-potong:#0E1218; --on-lem:#1F1800; --lipat:#A9B4C4; --on-lipat:#0E1218;
  --ok:#4CC38A; --warn:#E9B14F; --bad:#F08080; --okbg:#143222; --warnbg:#35290F; --badbg:#3A1B1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C25; --surface2:#1C2430; --ink:#E7EBF1; --muted:#9AA5B5; --line:#2B3441;
  --accent:#93A9FF; --on-accent:#0E1218;
  --cetak:#3CC0E8; --potong:#F06BAA; --lem:#F2C230; --on-cetak:#0E1218; --on-potong:#0E1218; --on-lem:#1F1800; --lipat:#A9B4C4; --on-lipat:#0E1218;
  --ok:#4CC38A; --warn:#E9B14F; --bad:#F08080; --okbg:#143222; --warnbg:#35290F; --badbg:#3A1B1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;padding-inline:16px;padding-block:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.wrap{max-width:1180px;margin-inline:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:25;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px}
.brand svg{color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi strong{font-family:var(--font-mono);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.sec{margin-top:24px}.sec>h2{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table.t{width:100%;border-collapse:collapse;min-width:680px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12.5px}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}
.btn{padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-cetak{--c:var(--cetak);--onc:var(--on-cetak)}.st-potong{--c:var(--potong);--onc:var(--on-potong)}.st-lem{--c:var(--lem);--onc:var(--on-lem)}
.sp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.sp i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:126px}
.steps i{height:8px;background:var(--line);border-radius:1px}
.steps i.selesai{background:var(--c)}
.steps i.jeda{background:var(--bad)}
.steps i.berjalan{background:var(--c);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.meter b{display:block;height:100%;background:var(--c,var(--accent))}
.stcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;min-width:0}
.stcard .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stcard .bar{height:4px;background:var(--c);margin:-14px -14px 12px;border-radius:var(--radius) var(--radius) 0 0}
.jobcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.jobcard h3{overflow-wrap:anywhere}
/* gantt */
.gantt{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.g-in{position:relative}
.g-head,.g-row{display:flex}
.g-corner,.g-lab{flex:0 0 84px;position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);padding:8px 10px;font-weight:600}
.g-day{flex:0 0 180px;padding:8px 10px;border-right:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line)}
.g-day b{color:var(--ink)}.g-day.today{background:var(--okbg)}
.g-corner{background:var(--surface2);border-bottom:1px solid var(--line)}
.g-track{position:relative;flex:none}
.g-row{border-bottom:1px solid var(--line)}.g-row:last-child{border-bottom:0}
.blk{position:absolute;height:32px;border:0;border-radius:3px;background:var(--c);color:var(--onc);font-size:12px;font-weight:600;padding:0 7px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.blk.selesai{opacity:.4}
.blk.berjalan{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 6px,transparent 6px 12px)}
.blk.jeda{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px);outline:2px solid var(--bad);outline-offset:-3px}
.blk.manual{outline:2px dashed var(--ink);outline-offset:-3px}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
/* forms and modal */
label.f{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:13px;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal[hidden]{display:none}
.sg{position:relative;display:block;min-width:0}.sjrow .sg{flex:1}
.sg .sgin{width:100%}
.sgl{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:60;display:block;max-height:240px;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,14,20,.28)}
.sgl[hidden]{display:none}
.ikon-p{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-width:68px}
.ikon-p:has(input:checked){border-color:var(--accent);background:var(--surface2)}
.ikon-p input{position:absolute;opacity:0;pointer-events:none}
.sgi{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font:inherit;cursor:pointer}
.sgi:last-child{border-bottom:0}
.sgi:hover,.sgi:active{background:var(--surface2)}
.sgi b{display:block;font-weight:600}
.sgi small{display:block;color:var(--muted);margin-top:2px}
[hidden]{display:none!important}
.blk.luar{border:2px dotted var(--ink)}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:720px;padding:20px;display:flex;flex-direction:column;gap:14px}
.mbox.narrow{max-width:460px}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.err{color:var(--bad);font-weight:500}
.pv{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.demo{display:grid;gap:6px}
.demo button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;cursor:pointer}
.day-h{margin:18px 0 8px;font-family:var(--font-display);font-weight:700;font-size:15px}
.note{font-size:12.5px;color:var(--muted)}
.alertcard{border-color:var(--bad);background:var(--badbg)}
.st-lipat{--c:var(--lipat);--onc:var(--on-lipat)}
.blk.tertahan{outline:2px solid var(--bad);outline-offset:-3px}
.jamgrid{display:grid;grid-template-columns:auto 70px auto 70px;gap:8px 8px;align-items:center;max-width:380px}
.jamgrid input[type=number]{width:100%}
.sjrow{display:flex;gap:8px;align-items:center}.sjrow select{flex:1;min-width:0}.sjrow input{width:110px;flex:none}
:root{--paper:#FFFFFF;--paper-ink:#14181F;--paper-line:#B9C0CA;--paper-mute:#4A5463;--paper-head:#EEF0F3}
.sj{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sj-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:12px}
.sj-t{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.04em}
.sj-s{font-size:13px}.sj-no{text-align:right;font-size:13px}
.sj-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sj-meta span,.sj-ttd span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-mute)}
.sj-tw{overflow-x:auto}
.sj-tb{width:100%;border-collapse:collapse;min-width:420px}
.sj-tb th,.sj-tb td{border:1px solid var(--paper-line);padding:7px 9px;text-align:left}
.sj-tb th{background:var(--paper-head);font-size:12px}
.sj-ttd{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.sj-ttd i{display:block;height:54px;border-bottom:1px solid var(--paper-ink)}
.bottomnav{display:none}
.menus{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:0;min-width:0}
.menus legend{font-weight:600;padding-inline:6px}
.menugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chk{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface2);font-weight:500}
.seg{max-width:100%;overflow-x:auto}
@media (max-width:700px){
  body{font-size:15px}
  h1{font-size:22px}
  .top{padding-block:8px;flex-wrap:nowrap}
  .brand{font-size:17px;min-width:0;white-space:nowrap}
  .who{min-width:0;gap:8px}.who-n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}.who-r{display:none}.who-out{flex:none}
  nav.tabs{display:none}
  .wrap{padding-bottom:88px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav button{flex:1;min-width:0;min-height:54px;background:none;border:0;border-top:3px solid transparent;padding:8px 2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .bottomnav .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bottomnav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}
  .bottomnav .pill{padding:0 6px;font-size:11px}
  .btn{min-height:42px}.btn.sm{min-height:38px;padding:6px 12px}
  input,select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox]{min-height:0;width:20px;height:20px}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi strong{font-size:24px}
  .page-h{align-items:stretch}.page-h>.btn,.page-h>.row{width:100%}
  .cols{grid-template-columns:1fr}
  .tw{border:0;background:none;overflow:visible}
  table.t{min-width:0!important;display:block}
  .t thead{display:none}
  .t tbody{display:grid;gap:10px}
  .t tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px}
  .t td{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);text-align:right;min-width:0!important;white-space:normal}
  .t td:last-child{border-bottom:0}
  .t td::before{content:attr(data-label);flex:none;max-width:40%;text-align:left;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
  .t td[data-label=""]::before{display:none}
  .t td[data-label=""]{justify-content:flex-end}
  .t td .row{justify-content:flex-end}
  .t td .link{text-align:right}
  .t td .steps{width:150px}
  .t td.num{white-space:normal}
  .modal{padding:0;align-items:flex-start}
  .mbox,.mbox.narrow{max-width:none!important;min-height:100%;border:0;border-radius:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .mh{position:sticky;top:0;background:var(--surface);z-index:2;padding-bottom:8px}
  .fg{grid-template-columns:1fr}
  .sjrow input{width:90px}
  .login{margin-top:4vh}
  .g-corner,.g-lab{flex-basis:70px;padding-inline:6px}
  .legend{font-size:12px}
}

@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

<script>
/* ===== Konstanta ===== */
const KEY='meja-produksi.v7';
const TAHAP={
  cetakBingkai:{nama:'Cetak bingkai (sebelum cetak isi)',pendek:'Cetak bingkai',st:'cetak',dep:['potongKertas'],unit:'lembar'},

  potongKertas:{nama:'Potong kertas isi (sebelum cetak)',pendek:'Potong kertas isi',st:'potong',dep:[],unit:'lembar'},
  potongKertasSampul:{nama:'Potong kertas sampul (sebelum cetak)',pendek:'Potong kertas sampul',st:'potong',dep:[],unit:'lembar'},
  laminasi:{nama:'Laminasi sampul (di luar)',pendek:'Laminasi',st:'potong',dep:['cetakSampul'],unit:'lembar',luarTahap:true},
  potongSampul:{nama:'Potong sampul (setelah cetak)',pendek:'Potong sampul',st:'potong',dep:['cetakSampul','laminasi'],unit:'lembar'},
  lipat:{nama:'Lipat isi',pendek:'Lipat',st:'lipat',dep:['cetakIsi'],unit:'lembar'},
  seri:{nama:'Seri (susun halaman)',pendek:'Seri',st:'lipat',dep:['lipat'],unit:'isi'},
  lem:{nama:'Lem',pendek:'Lem',st:'lem',dep:['seri','potongSampul'],unit:'buku'},
  potongBuku:{nama:'Potong buku',pendek:'Potong buku',st:'potong',dep:['lem'],unit:'buku'},
  indexAbjad:{nama:'Index abjad (di luar)',pendek:'Index abjad',st:'potong',dep:['potongBuku'],unit:'buku',luarTahap:true}

const URUT=['potongKertas','potongKertasSampul','cetakBingkai','cetakIsi','cetakSampul','laminasi','potongSampul','lipat','seri','lem','potongBuku','indexAbjad'];
const STASIUN={cetak:'Cetak',potong:'Potong',lipat:'Lipat',lem:'Lem'};
const PERAN={owner:'Pemilik',admin:'Admin / PPIC',op_cetak:'Operator cetak',op_potong:'Operator potong',op_lem:'Operator lem',op_lipat:'Operator lipat',op_seri:'Operator seri',op_naskah:'Operator naskah',gudang:'Gudang'};

const at=(d,h)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0,0,0);
const isWork=d=>S.settings.hari.includes(d.getDay());
function jamHari(d){const g=S.settings.jam&&S.settings.jam[d.getDay?d.getDay():d];return g?[+g[0],+g[1]]:[S.settings.jamMulai,S.settings.jamSelesai]}
function jamRentang(){const h=S.settings.hari.map(x=>jamHari(x));return h.length?[Math.min(...h.map(x=>x[0])),Math.max(...h.map(x=>x[1]))]:[S.settings.jamMulai,S.settings.jamSelesai]}
function jamTeks(){
  const o=[1,2,3,4,5,6,0].filter(d=>S.settings.hari.includes(d)).map(d=>[d,jamHari(d)]),g=[];
  o.forEach(([d,j])=>{const k=pad(j[0])+'.00–'+pad(j[1])+'.00',l=g[g.length-1];if(l&&l.k===k)l.e=d;else g.push({a:d,e:d,k})});
  return g.map(x=>(x.a===x.e?HARI[x.a]:HARI[x.a]+'–'+HARI[x.e])+' '+x.k).join(', ');
}
function align(ts){
  let d=new Date(ts);
  for(let i=0;i<800;i++){
    const [jm,js]=jamHari(d);
    if(isWork(d)){const s=at(d,jm),e=at(d,js);if(d<s)return +s;if(d<e)return +d;}
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0,0);
  }
  return +d;
}
function workMin(a,b){
  if(b<=a)return 0;
  let t=align(a),tot=0;
  for(let i=0;i<4000&&t<b;i++){const d=new Date(t),e=+at(d,jamHari(d)[1]);tot+=(Math.min(e,b)-t)/60000;t=align(e)}
  return Math.round(tot);
}
const jalan=j=>j.status==='berjalan'||j.status==='jeda';
function extraLeft(j,now){
  now=now||Date.now();const x=j.extraMin||0;if(!x)return 0;
  if(j.status==='jeda')return x;
  return Math.max(0,x-workMin(j.extraAt||now,now));
}
function addWork(ts,min){
  let t=align(ts),rem=min;
  for(let i=0;i<4000;i++){
    const d=new Date(t),e=at(d,jamHari(d)[1]),avail=(e-d)/60000;
    if(rem<=avail)return t+rem*60000;
    rem-=avail;t=align(+e);
  }
  return t;
}

const FRONT_LOG=['mutasi','suratJalan','pakai','beli','lembur'];
function mergeState(base,local,remote){
  const out=JSON.parse(JSON.stringify(remote));base=base||{};
  const key=r=>(r&&typeof r==='object'&&r.id!=null)?'i:'+r.id:'j:'+JSON.stringify(r);
  const js=JSON.stringify;
  for(const k of new Set([...Object.keys(local),...Object.keys(base)])){
    const L=local[k],B=base[k],R=remote[k];
    if(Array.isArray(L)||Array.isArray(B)||Array.isArray(R)){
      const la=Array.isArray(L)?L:[],ba=Array.isArray(B)?B:[],ra=Array.isArray(R)?R:[];
      const bm=new Map(ba.map(r=>[key(r),js(r)])),lm=new Map(la.map(r=>[key(r),r])),res=new Map(ra.map(r=>[key(r),r]));
      for(const kk of bm.keys())if(!lm.has(kk))res.delete(kk);
      const baru=[];
      for(const [kk,r] of lm){if(!bm.has(kk)){if(!res.has(kk))baru.push([kk,r])}else if(bm.get(kk)!==js(r))res.set(kk,r)}
      let arr=[...res.entries()];
      if(FRONT_LOG.includes(k))arr=[...baru,...arr];else arr=[...arr,...baru];
      out[k]=arr.map(x=>x[1]);
    }else if(k==='seq'||k==='sjSeq'){out[k]=Math.max(+L||0,+R||0)}
    else if(js(L)!==js(B))out[k]=L;
  }
  return out;
}

async function syncPush(){

  const sent=JSON.stringify(S);if(sent===sync.lastJson)return;
  sync.busy=true;setSync('menyimpan');

    let r=JSON.parse(await gasCall('apiSave',sync.kode,sync.rev,sent)),payload=sent;
    if(r.conflict){
      const remote=JSON.parse(r.state);
      S=mergeState(sync.base,JSON.parse(sent),remote);migrasi();keepUser();
      sync.rev=r.rev;sync.base=remote;sync.lastJson=JSON.stringify(remote);
      payload=JSON.stringify(S);
      r=JSON.parse(await gasCall('apiSave',sync.kode,sync.rev,payload));
      try{localStorage.setItem(KEY,payload)}catch(e){}
      if(!(ui.modal||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))))render();
    }
    if(r.ok){sync.rev=r.rev;sync.lastJson=payload;sync.base=JSON.parse(payload);setSync('ok')}
    else if(r.needCode){setSync('kode');tanyaKode()}

const HAL_KATER=16;
function halEf(o){return o.isi==='sebagian'?Math.max(1,(+o.halSampai||0)-(+o.halDari||0)+1):o.halaman}
function tahapList(o){
  if(o.dariStok)return URUT.filter(k=>k==='lem'||k==='potongBuku'||(k==='indexAbjad'&&(o.kamus||o.bingkai)));
  const isi=o.isi||'penuh',sm=o.sampul||'sendiri',L=[];
  if(isi!=='tidak')L.push('potongKertas','cetakIsi','lipat');
  if(isi!=='tidak'&&o.bingkai)L.push('cetakBingkai');
  if(isi==='penuh')L.push('seri');
  if(sm==='sendiri')L.push('potongKertasSampul');
  if(sm!=='tidak')L.push('cetakSampul','potongSampul');

}

/* ===== Penjadwalan ===== */
function slot(st,earliest,dur,busy){
  let c=align(earliest);
  for(let g=0;g<3000;g++){
    const e=addWork(c,dur);
    const hits=busy[st].filter(b=>b[0]<e&&b[1]>c).sort((a,b)=>a[0]-b[0]);
    if(!hits.length)return [c,e];
    c=align(hits[0][1]);
  }
  return [c,addWork(c,dur)];
}
function selarasTarget(){
  S.orders.forEach(o=>{
    const J=k=>S.jobs.find(j=>j.orderId===o.id&&j.key===k);
    const lem=J('lem'),seri=J('seri'),ps=J('potongSampul'),pb=J('potongBuku');
    const set=(j,t)=>{t=Math.max(j.done||0,Math.round(t));if(t>0&&t!==j.qty){j.qty=t;j.durMin=durasi(j.key,t)}};
    if(lem&&lem.status!=='selesai'&&seri&&seri.status==='selesai'&&(!ps||ps.status==='selesai')&&seri.done>0){
      let t=seri.done;
      if(ps&&ps.done>0)t=Math.min(t,Math.floor(ps.done*(o.ups||1)));
      set(lem,t);
    }
    if(pb&&pb.status!=='selesai'&&lem&&lem.status==='selesai'&&lem.done>0)set(pb,lem.done);
    const ix=J('indexAbjad'),lm=J('laminasi'),cs=J('cetakSampul');
    if(ix&&ix.status==='menunggu'&&pb&&pb.status==='selesai'&&pb.done>0)ix.qty=pb.done;
    if(lm&&lm.status==='menunggu'&&cs&&cs.status==='selesai'&&cs.done>0)lm.qty=cs.done;
  });
}
function scheduleAll(){
  selarasTarget();
  const now=Date.now(),busy={cetak:[],potong:[],lipat:[],lem:[]};
  S.jobs.forEach(j=>{
    if(!jalan(j))return;
    if(j.luar){j.selesai=Math.max((j.mulaiAktual||now)+j.durMin*60000,now+60000);return}
    const st=TAHAP[j.key].st;
    const rem=Math.max(5,Math.round(j.durMin*(1-Math.min(1,j.done/j.qty))))+extraLeft(j,now);
    const s0=align(now);j.selesai=addWork(s0,rem);busy[st].push([s0,j.selesai]);
  });
  const runBusy={};Object.keys(busy).forEach(k=>runBusy[k]=busy[k].slice());
  S.jobs.filter(j=>j.manual&&j.status==='menunggu').sort((x,y)=>(x.manualAt||x.mulai)-(y.manualAt||y.mulai)).forEach(j=>{
    const st=TAHAP[j.key].st,want=j.manualAt||j.mulai;j.manualAt=want;
    if(j.luar){j.mulai=want;j.selesai=want+j.durMin*60000;return}
    const r=slot(st,want,j.durMin,runBusy);j.mulai=r[0];j.selesai=r[1];busy[st].push(r);
  });
  S.prioritas.forEach(id=>{
    const o=order(id);if(!o)return;
    const js=oj(o);
    URUT.forEach(k=>{
      const j=js.find(x=>x.key===k);
      if(!j||j.status!=='menunggu'||j.manual)return;
      let earliest=now;
      depsOf(j).forEach(dk=>{const d=js.find(x=>x.key===dk);if(d.selesai>earliest)earliest=d.selesai});
      if(j.luar){j.mulai=earliest;j.selesai=earliest+j.durMin*60000;return}
      const st=TAHAP[k].st,r=slot(st,earliest,j.durMin,busy);
      j.mulai=r[0];j.selesai=r[1];busy[st].push(r);
    });
  });
}

/* ===== Turunan ===== */
function info(o){
  const js=oj(o),done=js.every(j=>j.status==='selesai');
  const est=Math.max(...js.map(j=>j.selesai||0));
  const prog=js.reduce((a,j)=>a+(j.status==='selesai'?1:Math.min(1,j.done/j.qty)),0)/js.length;
  const cur=js.find(jalan)||js.find(j=>j.status!=='selesai');
  const diff=est-o.deadline,rev=S.revisi.filter(r=>r.orderId===o.id&&r.status==='terbuka').length;
  return {js,done,est,prog,cur,diff,rev,late:!done&&diff>0,tight:!done&&diff<=0&&diff>-2*DAY};
}
function chip(i){
  if(i.done)return '<span class="pill ok">Selesai</span>';
  const a=[];
  if(i.rev)a.push('<span class="pill warn">Tertahan revisi</span>');
  if(i.late)a.push('<span class="pill bad">Terlambat '+Math.ceil(i.diff/DAY)+' hari</span>');
  else if(i.tight)a.push('<span class="pill warn">Mepet</span>');
  else if(!i.rev)a.push('<span class="pill ok">Aman</span>');
  return a.join(' ');
}
function siap(j){return depsOf(j).every(dk=>S.jobs.find(x=>x.orderId===j.orderId&&x.key===dk).status==='selesai')&&!tertahan(j)}
function reservasi(){
  const r={};
  S.orders.forEach(o=>oj(o).forEach(j=>{
    if(j.status==='selesai'||j.luar)return;
    let m,amt;
    if(j.key==='cetakIsi'){m=o.bahanIsi;amt=j.qty-j.done-j.rusak}
    else if(j.key==='cetakSampul'){m=o.bahanSampul;amt=j.qty-j.done-j.rusak}
    else if(j.key==='lem'){const l=lemMat();m=l&&l.id;amt=(j.qty-j.done)*S.settings.lemGram/1000}
    else return;
    if(m&&amt>0)r[m]=(r[m]||0)+amt;
  }));
  return r;
}

function jobsFor(stf){return S.jobs.filter(j=>(stf==='semua'||TAHAP[j.key].st===stf)&&(!j.luar||!ownSt()))}
function gantt(stations){
  const s=S.settings,[jm,jsel]=jamRentang(),DW=isMobile()?130:180;
  const base=new Date();base.setHours(0,0,0,0);
  base.setDate(base.getDate()-((base.getDay()+6)%7)+ui.week*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);if(s.hari.includes(d.getDay()))days.push(d)}
  if(!days.length)return '<div class="card muted">Tidak ada hari kerja. Atur di Pengaturan.</div>';
  const shiftMs=(jsel-jm)*3600000,now=Date.now();
  const head='<div class="g-head"><div class="g-corner"></div>'+days.map(d=>'<div class="g-day'+(sameDay(d,now)?' today':'')+'" style="flex-basis:'+DW+'px"><b>'+HARI[d.getDay()]+'</b> '+d.getDate()+'/'+(d.getMonth()+1)+'</div>').join('')+'</div>';
  const rows=stations.map(st=>{
    const js=S.jobs.filter(j=>TAHAP[j.key].st===st).sort((a,b)=>a.mulai-b.mulai);
    const lanes=[];const lane=new Map();
    js.forEach(j=>{let l=lanes.findIndex(e=>e<=j.mulai);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=j.selesai;lane.set(j.id,l)});
    const h=Math.max(1,lanes.length)*38+8;
    let blocks='';
    js.forEach(j=>{
      let first=true;
      days.forEach((d,di)=>{
        const ds=+at(d,jm),hj=jamHari(d),da=+at(d,hj[0]),de=+at(d,hj[1]),a=Math.max(j.mulai,da),b=Math.min(j.selesai,de);
        if(b<=a)return;
        const x=di*DW+(a-ds)/shiftMs*DW,w=Math.max(6,(b-a)/shiftMs*DW-2);
        const o=order(j.orderId);
        blocks+='<button class="blk st-'+st+' '+j.status+(j.luar?' luar':'')+(j.manual?' manual':'')+(tertahan(j)?' tertahan':'')+'" style="left:'+x.toFixed(1)+'px;width:'+w.toFixed(1)+'px;top:'+(4+lane.get(j.id)*38)+'px" data-act="detail" data-id="'+o.id+'" title="'+esc(TAHAP[j.key].nama+' · '+o.judul+' · '+fDT(j.mulai)+' sampai '+fDT(j.selesai))+'">'+(first?esc(TAHAP[j.key].pendek+' · '+o.judul):'')+'</button>';
        first=false;
      });
    });
    let nl='';
    days.forEach((d,di)=>{if(sameDay(d,now)){const ds=+at(d,jm),hj=jamHari(d);if(now>=+at(d,hj[0])&&now<=+at(d,hj[1]))nl='<div class="nowline" style="left:'+(di*DW+(now-ds)/shiftMs*DW).toFixed(1)+'px"></div>'}});
    return '<div class="g-row st-'+st+'" style="height:'+h+'px"><div class="g-lab">'+stPill(st)+'</div><div class="g-track" style="width:'+days.length*DW+'px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:'+DW+'px 100%">'+blocks+nl+'</div></div>';
  }).join('');
  return '<div class="gantt"><div class="g-in" style="min-width:'+(84+days.length*DW)+'px">'+head+rows+'</div></div>';
}
function weekLabel(){
  const base=new Date();base.setHours(0,0,0,0);
  base.setDate(base.getDate()-((base.getDay()+6)%7)+ui.week*7);
  const end=new Date(base);end.setDate(base.getDate()+6);
  return fD(base)+' – '+fD(end);
}

  };
  const th='<thead><tr><th>Jam</th><th>Tahap</th><th>Pesanan</th><th>Target</th><th>Status</th><th></th></tr></thead>';

  });
  if(selesai.length)out+='<div class="day-h">Sudah selesai</div><div class="tw"><table class="t"><thead><tr><th>Selesai</th><th>Tahap</th><th>Pesanan</th><th>Hasil</th></tr></thead><tbody>'+selesai.map(j=>'<tr><td class="num">'+fDT(j.selesai)+'</td><td>'+sp(j.key)+'</td><td>'+esc(order(j.orderId).judul)+'</td><td class="num">'+fN(j.done)+' baik, '+fN(j.rusak)+' rusak</td></tr>').join('')+'</tbody></table></div>';
  return out;
}

  const L=(S.beli||[]).filter(x=>!b||x.tgl.slice(0,7)===b).sort((a,c)=>(c.tgl+c.ts).localeCompare(a.tgl+a.ts));
  const tot=L.reduce((a,x)=>a+x.total,0),nilai=S.materials.reduce((a,m)=>a+(m.harga||0)*m.stok,0);
  const per={};L.forEach(x=>{const q=per[x.matId]=per[x.matId]||{nama:x.nama,satuan:x.satuan,jenis:x.jenis,qty:0,total:0,n:0};q.qty+=x.qty;q.total+=x.total;q.n++});
  const PB=Object.values(per).sort((a,c)=>c.total-a.total);

const inBulan=(ts,b)=>{if(!b)return true;const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)===b};

function kinerjaData(b){
  const nm=u=>u.nama,jobs=S.jobs;
  const prod=S.users.filter(u=>PERAN_ST[u.peran]).map(u=>{
    const mine=jobs.filter(j=>j.operator===u.nama);
    const fin=mine.filter(j=>j.status==='selesai'&&inBulan(j.selesaiAktual||j.selesai,b));
    let baik=0,rusak=0;mine.forEach(j=>j.laporan.forEach(l=>{if(inBulan(l.ts,b)){baik+=l.baik;rusak+=l.rusak}}));
    let rencana=0,aktual=0;
    fin.forEach(j=>{if(j.mulaiAktual&&j.selesaiAktual&&!j.luar){const jd=(j.jedaLog||[]).reduce((a,g)=>a+(g.menit||0),0);const ak=Math.max(1,workMin(j.mulaiAktual,j.selesaiAktual)-jd);rencana+=j.durMin;aktual+=ak}});
    const jeda=mine.reduce((a,j)=>a+(j.jedaLog||[]).filter(g=>inBulan(g.dari,b)).length,0);
    const tambah=mine.reduce((a,j)=>a+(j.tambahLog||[]).filter(g=>inBulan(g.ts,b)).length,0);
    const lm=(S.lembur||[]).filter(r=>r.userId===u.id&&r.status==='disetujui'&&(!b||r.tgl.slice(0,7)===b));
    return {u,tahap:fin.length,baik,rusak,rencana,aktual,jeda,tambah,lemMenit:lm.reduce((a,r)=>a+r.menit,0),lemUpah:lm.reduce((a,r)=>a+r.upah,0)};
  });
  const staf=S.users.filter(u=>!PERAN_ST[u.peran]&&u.peran!=='owner').map(u=>{
    let lap=0;jobs.forEach(j=>j.laporan.forEach(l=>{if(l.oleh===u.nama&&inBulan(l.ts,b))lap++}));
    const sj=S.suratJalan.filter(x=>x.oleh===u.nama&&inBulan(x.ts,b)).length;
    const rvA=S.revisi.filter(x=>x.pembuat===u.nama&&inBulan(x.dibuat,b)).length,rvS=S.revisi.filter(x=>x.selesaiOleh===u.nama&&inBulan(x.selesaiTs,b)).length;
    const lm=(S.lembur||[]).filter(r=>r.userId===u.id&&r.status==='disetujui'&&(!b||r.tgl.slice(0,7)===b));
    return {u,lap,sj,rvA,rvS,lemMenit:lm.reduce((a,r)=>a+r.menit,0)};
  });
  const pel=S.pelipat.map(p=>{
    let baik=0,rusak=0,ongkos=0,belum=0;
    jobs.filter(j=>j.key==='lipat').forEach(j=>j.laporan.forEach(l=>{if(l.pelipatId===p.id&&inBulan(l.ts,b)){baik+=l.baik;rusak+=l.rusak;ongkos+=l.ongkos||0;if(!l.dibayar)belum+=l.ongkos||0}}));
    return {p,baik,rusak,ongkos,belum};
  });
  return {prod,staf,pel};
}
function pageKinerja(){
  if(!can('kinerja'))return '<div class="page-h"><div><h1>Kinerja karyawan</h1></div></div><div class="card muted">Hanya pemilik dan admin yang dapat melihat kinerja karyawan.</div>';
  const b=ui.kBulan===undefined?bulanIni():ui.kBulan,D=kinerjaData(b);
  const pct=(r,t)=>t>0?Math.round(r/t*1000)/10:0;
  const tBaik=D.prod.reduce((a,x)=>a+x.baik,0),tRusak=D.prod.reduce((a,x)=>a+x.rusak,0),tTahap=D.prod.reduce((a,x)=>a+x.tahap,0),tLem=D.prod.reduce((a,x)=>a+x.lemMenit,0)+D.staf.reduce((a,x)=>a+x.lemMenit,0);
  const efis=x=>x.aktual>0?Math.round(x.rencana/x.aktual*100):null;
  const efisPill=e=>e==null?'<span class="muted">–</span>':'<span class="pill '+(e>=100?'ok':e>=80?'warn':'bad')+'">'+e+'%</span>';
  const rPill=p=>'<span class="pill '+(p<=3?'ok':p<=6?'warn':'bad')+'">'+p+'%</span>';
  const prod=D.prod.length?'<div class="tw"><table class="t" style="min-width:860px"><thead><tr><th>Operator</th><th>Tahap selesai</th><th>Hasil baik</th><th>Rusak</th><th>Tingkat rusak</th><th>Waktu vs rencana</th><th>Jeda</th><th>Tambah waktu</th><th>Lembur</th></tr></thead><tbody>'+D.prod.map(x=>'<tr><td><b>'+esc(x.u.nama)+'</b><div class="small muted">'+PERAN[x.u.peran]+'</div></td><td class="num">'+x.tahap+'</td><td class="num">'+fN(x.baik)+'</td><td class="num">'+fN(x.rusak)+'</td><td>'+(x.baik+x.rusak?rPill(pct(x.rusak,x.baik+x.rusak)):'<span class="muted">–</span>')+'</td><td>'+efisPill(efis(x))+(x.aktual?'<div class="small muted">rencana '+fMin(x.rencana)+', aktual '+fMin(x.aktual)+'</div>':'')+'</td><td class="num">'+x.jeda+'×</td><td class="num">'+x.tambah+'×</td><td class="num">'+(x.lemMenit?fMin(x.lemMenit):'–')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card muted">Belum ada akun operator.</div>';
  const pel=D.pel.length?'<div class="tw"><table class="t" style="min-width:640px"><thead><tr><th>Pelipat</th><th>Lembar baik</th><th>Rusak</th><th>Tingkat rusak</th><th>Ongkos</th><th>Belum dibayar</th></tr></thead><tbody>'+D.pel.map(x=>'<tr><td><b>'+esc(x.p.nama)+'</b></td><td class="num">'+fN(x.baik)+'</td><td class="num">'+fN(x.rusak)+'</td><td>'+(x.baik+x.rusak?rPill(pct(x.rusak,x.baik+x.rusak)):'<span class="muted">–</span>')+'</td><td class="num">'+fR(x.ongkos)+'</td><td class="num">'+fR(x.belum)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card muted">Belum ada pelipat.</div>';
  const staf=D.staf.length?'<div class="tw"><table class="t" style="min-width:640px"><thead><tr><th>Karyawan</th><th>Laporan hasil dicatat</th><th>Surat jalan dibuat</th><th>Revisi diajukan</th><th>Revisi diselesaikan</th><th>Lembur</th></tr></thead><tbody>'+D.staf.map(x=>'<tr><td><b>'+esc(x.u.nama)+'</b><div class="small muted">'+PERAN[x.u.peran]+'</div></td><td class="num">'+x.lap+'</td><td class="num">'+x.sj+'</td><td class="num">'+x.rvA+'</td><td class="num">'+x.rvS+'</td><td class="num">'+(x.lemMenit?fMin(x.lemMenit):'–')+'</td></tr>').join('')+'</tbody></table></div>':'';
  return '<div class="page-h"><div><h1>Kinerja karyawan</h1><p>Ringkasan hasil kerja operator, pelipat, dan staf per bulan.</p></div></div>'+
   '<div class="row" style="margin-bottom:14px;gap:10px"><label class="f" style="min-width:170px">Bulan<input type="month" data-change="kBulan" value="'+(b||'')+'"></label><button class="btn sm" data-act="kinerjaSemua" style="align-self:end">Semua waktu</button></div>'+
   '<div class="kpis" style="margin-bottom:16px"><div class="kpi"><small>Tahap selesai</small><strong>'+tTahap+'</strong><em>'+esc(bulanLabel(b))+'</em></div><div class="kpi"><small>Hasil baik</small><strong>'+fN(tBaik)+'</strong></div><div class="kpi"><small>Tingkat rusak</small><strong>'+pct(tRusak,tBaik+tRusak)+'%</strong><em>'+fN(tRusak)+' rusak</em></div><div class="kpi"><small>Jam lembur disetujui</small><strong>'+fMin(tLem)+'</strong></div></div>'+

/* ===== Halaman: Gudang ===== */
function kondisi(t){
  const p=proyeksi(t);
  if(t.stok<=t.min){
    if(p<=t.min)return {k:'bad',l:t.stok===0?'Habis':'Perlu cetak ulang',c:'var(--bad)'};
    return {k:'warn',l:'Cetak ulang berjalan',c:'var(--warn)'};
  }
  if(t.stok<=t.min*1.25&&p<=t.min*1.25)return {k:'warn',l:'Mendekati batas',c:'var(--warn)'};
  return {k:'ok',l:'Cukup',c:'var(--ok)'};
}
function pageGudang(){
  const tab=ui.gtab||'stok';
  const seg='<div class="seg" role="group" aria-label="Bagian gudang" style="max-width:100%;overflow-x:auto">'+[['stok','Stok buku jadi'],['lapor','Lapor hasil'],['sj','Surat jalan'],['riwayat','Riwayat']].map(x=>'<button data-act="gtab" data-v="'+x[0]+'" aria-pressed="'+(tab===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
  const body=tab==='stok'?gStok():tab==='lapor'?gLapor():tab==='sj'?gSJ():gRiwayat();
  return '<div class="page-h"><div><h1>Gudang</h1><p>Stok buku jadi per judul, pengingat cetak ulang, laporan hasil produksi, dan surat jalan.</p></div></div><div style="margin-bottom:16px">'+seg+'</div>'+body;
}
function gStok(){
  const ed=can('stokBuku'),al=S.judul.filter(perluUlang);
  const notice=ui.notice?'<div class="card" style="border-color:var(--ok);margin-bottom:16px">'+esc(ui.notice)+'</div>':'';
  const alert=al.length?'<h2 style="margin-bottom:10px">Perlu cetak ulang</h2><div class="cols" style="margin-bottom:24px">'+al.map(t=>'<div class="jobcard alertcard"><h3>'+esc(t.judul)+'</h3><div class="small muted num">'+esc(t.sku)+'</div><div>Stok buku <b class="num">'+fN(t.stok)+'</b>, batas minimum <b class="num">'+fN(t.min)+'</b></div><div class="small muted">Usulan cetak ulang '+fN(t.qtyUlang)+' buku, target selesai '+t.hariUlang+' hari. Cetak ulang otomatis '+(t.auto?'aktif.':'nonaktif.')+'</div>'+(ed?'<button class="btn primary" data-act="cetakUlang" data-id="'+t.id+'">Jadwalkan cetak ulang</button>':'')+'</div>').join('')+'</div>':'';
  const rows=S.judul.map(t=>{
    const k=kondisi(t),masuk=proyeksi(t)-t.stok,pct=Math.min(100,Math.round(t.stok/Math.max(t.min*3,1)*100));
    return '<tr><td class="num">'+esc(t.sku)+'</td><td style="min-width:200px"><b>'+esc(t.judul)+'</b></td><td>'+esc(t.pengarang||'-')+'</td><td class="num">'+fN(t.halaman)+'</td><td class="num">'+esc(t.isbn||'-')+'</td>'+
     '<td style="min-width:150px"><b class="num">'+fN(t.stok)+'</b> <span class="small muted">buku</span><div class="meter" style="--c:'+k.c+';margin-top:4px"><b style="width:'+pct+'%"></b></div><div class="small muted">min '+fN(t.min)+(masuk>0?' · dicetak '+fN(masuk):'')+'</div>'+(t.isiDus>0?'<div class="small" style="margin-top:3px"><b>Packing:</b> '+packTeks(t)+' <span class="muted">(isi '+fN(t.isiDus)+' per dus)</span></div>':'')+'</td>'+
     '<td class="num">'+fN(t.stokIsi)+'</td><td style="min-width:130px">'+katerCell(t)+'</td><td class="num">'+fN(t.stokSampul)+'</td><td class="num">'+fN(t.stokLem||0)+'</td><td class="num">'+(t.bingkai||t.stokIndex?fN(t.stokIndex||0):'-')+'</td><td><span class="pill '+k.k+'">'+k.l+'</span></td>'+
     (ed?'<td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="keluar" data-id="'+t.id+'"'+(t.stok?'':' disabled')+'>Surat jalan</button><button class="btn sm" data-act="cetakUlang" data-id="'+t.id+'">Cetak ulang</button><button class="btn sm" data-act="lemStok" data-id="'+t.id+'"'+(lemStokTersedia(t)>0?'':' disabled')+' title="Lem isi dan sampul yang ada di gudang">Lem dari stok</button><button class="btn sm" data-act="editJudul" data-id="'+t.id+'">Ubah</button></div></td>':'')+'</tr>';
  }).join('');
  return notice+alert+'<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Stok buku jadi</h2>'+(ed?'<button class="btn primary" data-act="newJudul">+ Judul baru</button>':'')+'</div>'+
   (S.judul.length?'<div class="tw"><table class="t" style="min-width:1420px"><thead><tr><th>SKU</th><th>Judul</th><th>Pengarang</th><th>Halaman</th><th>ISBN</th><th>Stok buku</th><th>Stok isi</th><th>Stok kater</th><th>Stok sampul</th><th>Dilem, belum dipotong</th><th>Kamus belum index</th><th>Kondisi</th>'+(ed?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="card muted">Belum ada judul. Tambahkan judul atau buat pesanan dengan hasil masuk stok.</div>')+
   '<p class="note" style="margin-top:10px"><b>Stok buku</b>: isi dan sampul sudah dilem dan dipotong, siap jual. <b>Stok isi</b>: isi yang sudah dilipat dan diseri (halaman tersusun), menunggu dilem. <b>Stok sampul</b>: sampul yang sudah dipotong, menunggu dilem. <b>Kamus belum index</b>: buku kamus yang sudah dipotong tetapi belum di-index abjad di luar; masuk stok buku setelah penerimaan index dicatat. <b>Dilem, belum dipotong</b>: buku yang sudah dilem tetapi belum dipotong; berkurang saat hasil potong buku dilaporkan dan menjadi stok buku. <b>Stok kater</b>: hasil pesanan cetak sebagian halaman (misalnya kater 2), dicatat terpisah per rentang halaman dan tidak menambah stok isi. Stok bertambah otomatis dari laporan tiap tahap. Judul di bawah batas minimum muncul sebagai pengingat cetak ulang.</p>';
}
function gLapor(){
  const ready=S.jobs.filter(j=>j.key!=='lipat'&&j.key!=='seri'&&(j.status!=='selesai'||j.tunggu)&&(jalan(j)||j.tunggu||siap(j))).sort((a,b)=>(jalan(a)?0:1)-(jalan(b)?0:1)||a.mulai-b.mulai);
  const card=j=>{
    const o=order(j.orderId),pct=Math.round(Math.min(1,j.done/j.qty)*100);
    return '<div class="jobcard st-'+TAHAP[j.key].st+'"><div class="row" style="justify-content:space-between">'+sp(j.key)+statusPill(j.status)+'</div><h3>'+esc(o.judul)+'</h3>'+
     '<div class="small muted">Jadwal '+fDT(j.mulai)+' → '+fDT(j.selesai)+'</div>'+
     '<div class="meter"><b style="width:'+pct+'%"></b></div><div class="small"><span class="num">'+fN(j.done)+' / '+fN(j.qty)+'</span> '+TAHAP[j.key].unit+(j.rusak?' · rusak '+fN(j.rusak):'')+'</div>'+jedaInfo(j)+
     (bisaLapor(j)?'<button class="btn primary" data-act="lapor" data-id="'+j.id+'">Lapor hasil</button>':'')+luarBtn(j)+kendali(j)+'</div>';
  };
  const run=ready.filter(jalan),tg=ready.filter(j=>j.tunggu),next=ready.filter(j=>!jalan(j)&&!j.tunggu);
  const rep=['gudang','owner'].includes(ui.user.peran);
  return (rep?'<p class="muted" style="margin:0 0 14px">Laporkan hasil cetak, potong, lem, dan potong buku. Hasil lipat dan seri dilaporkan operator lipat di menu Lipat. Laporan sebagian boleh dikirim berkali-kali sampai tahap selesai.</p>':'<p class="muted" style="margin:0 0 14px">Laporan hasil hanya diisi oleh gudang dan pemilik.</p>')+
   '<h2 style="margin-bottom:10px">Sedang dikerjakan</h2>'+(run.length?'<div class="cols">'+run.map(card).join('')+'</div>':'<div class="card muted">Belum ada pekerjaan yang dimulai operator.</div>')+
   (tg.length?'<div class="sec"><h2>Menunggu laporan hasil</h2><p class="muted" style="margin:0 0 10px">Operator sudah menandai selesai, tetapi hasilnya belum dilaporkan sehingga stok belum bertambah.</p><div class="cols">'+tg.map(card).join('')+'</div></div>':'')+
   '<div class="sec"><h2>Siap dikerjakan</h2>'+(next.length?'<div class="cols">'+next.map(card).join('')+'</div>':'<div class="card muted">Tidak ada. Pekerjaan yang menunggu revisi naskah tidak ditampilkan di sini.</div>')+'</div>';
}
function sjTable(list){

  return '<div class="tw"><table class="t"><thead><tr><th>Nomor</th><th>Tanggal</th><th>Tujuan</th><th>Petugas pengambil</th><th>Isi</th><th></th></tr></thead><tbody>'+
   list.slice(0,60).map(sj=>'<tr><td class="num">'+esc(sj.no)+'</td><td class="num">'+fDT(sj.ts)+'</td><td>'+esc(sj.tujuan||'-')+'</td><td>'+esc(sj.petugas)+'</td><td>'+sj.items.map(it=>'<div class="small"><span class="num">'+esc(it.sku)+'</span> '+esc(it.judul)+' × '+fN(it.jumlah)+'</div>').join('')+'</td><td><button class="btn sm" data-act="sjLihat" data-id="'+sj.id+'">Lihat</button></td></tr>').join('')+'</tbody></table></div>';

function gSJ(){
  const ed=can('stokBuku');
  return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Surat jalan keluar gudang</h2>'+(ed?'<button class="btn primary" data-act="sjBaru">+ Surat jalan baru</button>':'')+'</div>'+
   '<p class="muted" style="margin:0 0 12px">Isi surat jalan: SKU, judul buku, jumlah, dan petugas yang mengambil. Stok buku berkurang saat surat jalan disimpan.</p>'+sjTable(S.suratJalan.filter(x=>x.tipe==='gudang'));
}
function gRiwayat(){
  const log=[];
  S.jobs.forEach(j=>j.laporan.forEach(l=>log.push({l,j})));
  log.sort((a,b)=>b.l.ts-a.l.ts);
  const TP={masuk:['ok','Masuk'],keluar:['gray','Keluar'],koreksi:['warn','Koreksi']},JN={buku:'Buku',isi:'Isi',sampul:'Sampul',kater:'Kater',lem:'Dilem',index:'Belum index'};
  const jml=m=>m.tipe==='keluar'?'−'+fN(m.qty):m.tipe==='masuk'?'+'+fN(m.qty):(m.qty>0?'+':'−')+fN(Math.abs(m.qty));
  return '<h2 style="margin-bottom:10px">Mutasi stok</h2>'+(S.mutasi.length?'<div class="tw"><table class="t"><thead><tr><th>Waktu</th><th>Judul</th><th>Stok</th><th>Jenis</th><th>Jumlah</th><th>Dicatat oleh</th><th>Keterangan</th></tr></thead><tbody>'+
   S.mutasi.slice(0,80).map(m=>{const t=judulById(m.judulId),tp=TP[m.tipe];return '<tr><td class="num">'+fDT(m.ts)+'</td><td>'+esc(t?t.judul:'(dihapus)')+'</td><td>'+JN[m.jenis||'buku']+'</td><td><span class="pill '+tp[0]+'">'+tp[1]+'</span></td><td class="num">'+jml(m)+'</td><td>'+esc(m.oleh)+'</td><td>'+esc(m.ket||'')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="card muted">Belum ada mutasi.</div>')+
   '<div class="sec"><h2>Laporan hasil produksi</h2>'+(log.length?'<div class="tw"><table class="t"><thead><tr><th>Waktu</th><th>Tahap</th><th>Pesanan</th><th>Baik</th><th>Rusak</th><th>Pelapor</th><th>Catatan</th></tr></thead><tbody>'+
   log.slice(0,60).map(x=>'<tr><td class="num">'+fDT(x.l.ts)+'</td><td>'+sp(x.j.key)+'</td><td>'+esc(order(x.j.orderId).judul)+'</td><td class="num">'+fN(x.l.baik)+'</td><td class="num">'+fN(x.l.rusak)+'</td><td>'+esc(x.l.oleh)+(x.l.pelipat?'<div class="small muted">dilipat: '+esc(x.l.pelipat)+'</div>':'')+'</td><td>'+esc(x.l.catatan||'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card muted">Belum ada laporan.</div>')+'</div>';
}

/* ===== Revisi, Lipat, Surat jalan ===== */
const BAGIAN={isi:'Isi',sampul:'Sampul',keduanya:'Isi dan sampul'};
function revBlok(orderId,key){
  return S.revisi.some(r=>r.orderId===orderId&&r.status==='terbuka'&&(r.bagian==='keduanya'||(key==='cetakIsi'&&r.bagian==='isi')||(key==='cetakSampul'&&r.bagian==='sampul')));
}
function tertahan(j){return (j.key==='cetakIsi'||j.key==='cetakSampul')&&j.status==='menunggu'&&revBlok(j.orderId,j.key)}
function bisaLapor(j){
  const r=ui.user.peran,ok=j.key==='lipat'?['op_lipat','owner'].includes(r):j.key==='seri'?['op_seri','op_lipat','owner'].includes(r):['gudang','owner'].includes(r);
  return !j.luar&&ok&&(jalan(j)||j.tunggu||(j.status==='menunggu'&&siap(j)));
}
const bisaLuar=()=>['owner','admin','gudang'].includes(ui.user.peran);
function luarInfo(j){
  if(!j.luar)return '';
  return '<div class="small"><b>Percetakan luar</b>: '+esc(j.vendor||'-')+' · '+Math.round(j.durMin/1440)+' hari'+(j.status==='berjalan'?' · dikirim '+fD(j.mulaiAktual)+', perkiraan kembali '+fD(j.selesai):'')+'</div>';
}
function luarBtn(j){

function bisaKendali(j){const r=ui.user.peran;return r==='owner'||r==='admin'||(PERAN_ST[r]===TAHAP[j.key].st&&(r!=='op_seri'||j.key==='seri'))}

function jedaInfo(j){
  let h=luarInfo(j);

  const x=extraLeft(j);if(jalan(j)&&x>=5)h+='<div class="small muted">Tambahan waktu tersisa '+fMin(x)+'</div>';

function resumeJob(j,now){

function dibawa(plId,jobId){

function render(){
  const app=document.getElementById('app');brandFavicon();
  if(!ui.user){app.innerHTML=loginView();renderModal();return}
  const nav=navItems().map(n=>n[0]);
  if(!nav.includes(ui.page))ui.page=landing(ui.user);
  const P={ringkasan:pageRingkasan,pesanan:pagePesanan,jadwal:pageJadwal,bahan:pageBahan,gudang:pageGudang,akun:pageAkun,pengaturan:pagePengaturan,revisi:pageRevisi,lipat:pageLipat,lembur:pageLembur,kinerja:pageKinerja};
  app.innerHTML=shell(P[ui.page]());
  labelTables(app);
  renderModal();
}
const commit=()=>{save();render()};

/* ===== Aksi ===== */
function act(a,d,el){
  switch(a){
    case 'demo':document.getElementById('lu').value=d.u;document.getElementById('lp').value=d.p;return;
    case 'logout':ui.user=null;ui.page=null;ui.view=null;ui.modal=null;try{sessionStorage.removeItem('meja.sesi')}catch(e){}render();return;
    case 'nav':ui.page=d.p;ui.confirm=null;ui.notice='';ui.modal=null;render();return;
    case 'gtab':ui.gtab=d.v;ui.notice='';render();return;
    case 'detail':ui.modal={t:'detail',id:d.id};renderModal();return;
    case 'close':ui.modal=null;ui.confirm=null;renderModal();return;
    case 'newOrder':ui.modal={t:'order'};renderModal();return;
    case 'prio':{const i=S.prioritas.indexOf(d.id),k=i+ +d.dir;if(k<0||k>=S.prioritas.length)return;[S.prioritas[i],S.prioritas[k]]=[S.prioritas[k],S.prioritas[i]];scheduleAll();commit();return}
    case 'sortDeadline':S.prioritas.sort((a,b)=>order(a).deadline-order(b).deadline);scheduleAll();commit();return;
    case 'delOrder':
      if(ui.confirm!=='o'+d.id){ui.confirm='o'+d.id;render();renderModal();return}
      S.orders=S.orders.filter(o=>o.id!==d.id);S.jobs=S.jobs.filter(j=>j.orderId!==d.id);S.prioritas=S.prioritas.filter(x=>x!==d.id);
      ui.modal=null;ui.confirm=null;scheduleAll();commit();return;
    case 'view':ui.view=d.v;render();return;
    case 'stf':ui.st=d.s;render();return;
    case 'week':ui.week=+d.d===0?0:ui.week+ +d.d;render();return;
    case 'resched':S.jobs.forEach(j=>{if(j.status==='menunggu')j.manual=false});scheduleAll();commit();return;
    case 'unlock':{const j=S.jobs.find(x=>x.id===d.id);j.manual=false;scheduleAll();commit();return}
    case 'mulai':{const j=S.jobs.find(x=>x.id===d.id);if(j.luar||!siap(j))return;j.operator=ui.user.nama;j.status='berjalan';j.mulai=Date.now();j.mulaiAktual=j.mulai;scheduleAll();commit();return}
    case 'jeda':{const j=S.jobs.find(x=>x.id===d.id);if(!j||j.status!=='berjalan'||!bisaKendali(j))return;ui.modal={t:'jeda',id:d.id};renderModal();return}
    case 'tambah':{const j=S.jobs.find(x=>x.id===d.id);if(!j||!jalan(j)||!bisaKendali(j))return;ui.modal={t:'tambah',id:d.id};renderModal();return}
    case 'lanjut':{const j=S.jobs.find(x=>x.id===d.id);if(!j||j.status!=='jeda'||!bisaKendali(j))return;resumeJob(j,Date.now());scheduleAll();ui.notice='';commit();return}
    case 'lanjutSemua':{const now=Date.now();S.jobs.forEach(j=>{if(j.status==='jeda'&&bisaKendali(j))resumeJob(j,now)});scheduleAll();commit();return}
    case 'selesaiAwal':{
      const j=S.jobs.find(x=>x.id===d.id);if(!j||j.status!=='berjalan'||!bisaKendali(j))return;
      if(j.key==='lipat'&&(bagiDari(j)||perluBagi(j))){ui.notice='Lipat selesai lewat konfirmasi tiap pelipat sesuai pembagian kater.';render();return}
      if(ui.confirm!=='sa'+j.id){ui.confirm='sa'+j.id;render();return}
      const now=Date.now(),plan=j.selesai,sv=workMin(now,plan);
      if(!j.operator&&PERAN_ST[ui.user.peran])j.operator=ui.user.nama;
      j.status='selesai';j.selesaiAktual=now;j.selesai=now;if(j.done<j.qty)j.tunggu=true;
      ui.confirm=null;scheduleAll();
      ui.notice=TAHAP[j.key].nama+' selesai'+(sv>=5?', '+fMin(sv)+' lebih awal dari estimasi. Pekerjaan berikutnya dimajukan.':'.')+(j.tunggu?' Hasilnya belum dilaporkan, jadi stok belum bertambah.':'');
      commit();return}
    case 'selesaiTahap':{
      const j=S.jobs.find(x=>x.id===d.id);
      if(!j||!['lipat','seri'].includes(j.key)||bagiDari(j)||perluBagi(j)||!(j.key==='seri'?['op_seri','op_lipat','owner']:['op_lipat','owner']).includes(ui.user.peran)||!(j.status==='berjalan'||(j.status==='menunggu'&&siap(j))))return;
      if(ui.confirm!=='st'+j.id){ui.confirm='st'+j.id;render();return}
      const now=Date.now(),plan=j.selesai,sv=workMin(now,plan);
      if(j.status==='menunggu'){j.mulai=now;j.mulaiAktual=now}
      j.status='selesai';j.selesaiAktual=now;j.selesai=now;if(j.done<j.qty)j.tunggu=true;
      ui.confirm=null;scheduleAll();
      ui.notice=(o=>(j.key==='lipat'?'Selesai dilipat: ':'Selesai diseri: ')+o.judul+'. '+(j.key==='lipat'?'Judul ini masuk ke proses Seri.':'Judul ini lanjut ke proses Lem.')+(sv>=5?' Selesai '+fMin(sv)+' lebih awal dari jadwal, tahap berikutnya dimajukan.':'')+(j.tunggu?' Hasil belum diisi, jadi isi hasilnya agar stok dan ongkos tercatat.':''))(order(j.orderId));
      commit();return}
    case 'bagiKater':{const j=S.jobs.find(x=>x.id===d.id);if(!j||j.key!=='lipat'||!can('sjLipat'))return;ui.modal={t:'bagi',id:j.id};renderModal();return}
    case 'selesaiBagi':{
      const j=S.jobs.find(x=>x.id===d.id);
      if(!j||!['lipat','seri'].includes(j.key)||!['op_lipat','owner'].includes(ui.user.peran)||!(j.status==='berjalan'||(j.status==='menunggu'&&siap(j))))return;
      const B=bagiDari(j),b=B&&B.find(x=>x.pelipatId===d.pl);if(!b)return;
      const key='sb'+j.id+d.pl;
      if(ui.confirm!==key){ui.confirm=key;render();return}
      ui.confirm=null;const now=Date.now(),pl=S.pelipat.find(x=>x.id===d.pl),nm=pl?pl.nama:'pelipat',lp=j.key==='lipat';
      if(j.status==='menunggu'){j.status='berjalan';j.mulai=now;j.mulaiAktual=now}
      if(lp)b.lipatSelesai=true;else b.seriSelesai=true;
      const o=order(j.orderId);
      if(bagiTuntas(j)){
        const sv=workMin(now,j.selesai);
        j.status='selesai';j.selesaiAktual=now;j.selesai=now;if(j.done<j.qty)j.tunggu=true;scheduleAll();
        ui.notice=(lp?'Semua bagian selesai dilipat: ':'Semua bagian selesai diseri: ')+o.judul+'. '+(lp?'Judul ini masuk ke proses Seri.':'Judul ini lanjut ke proses Lem.')+(sv>=5?' Selesai '+fMin(sv)+' lebih awal dari jadwal.':'')+(j.tunggu?' Hasil belum diisi lengkap, isi hasilnya agar stok dan ongkos tercatat.':'');
      }else ui.notice=nm+' selesai '+(lp?'melipat ':'menyeri ')+katerTeks(b).toLowerCase()+' untuk '+o.judul+'. Menunggu pelipat lain.';
      commit();return}
    case 'luarKirim':ui.modal={t:'luarKirim',id:d.id};renderModal();return;
    case 'luarTerima':ui.modal={t:'luarTerima',id:d.id};renderModal();return;
    case 'lapor':ui.modal={t:'lapor',id:d.id};renderModal();return;
    case 'newUser':ui.modal={t:'user',id:null};renderModal();return;
    case 'editUser':ui.modal={t:'user',id:d.id};renderModal();return;
    case 'delUser':
      if(ui.confirm!=='u'+d.id){ui.confirm='u'+d.id;render();return}
      S.users=S.users.filter(u=>u.id!==d.id);ui.confirm=null;commit();return;
    case 'newBahan':ui.modal={t:'bahan',id:null};renderModal();return;
    case 'beliSemua':ui.bBulan='';render();return;
    case 'lemburSemua':ui.lBulan='';render();return;
    case 'kinerjaSemua':ui.kBulan='';render();return;
    case 'newLembur':ui.modal={t:'lembur'};renderModal();return;
    case 'lemburSetuju':{const r=(S.lembur||[]).find(x=>x.id===d.id);if(!r||!can('lemburKelola')||r.status!=='menunggu')return;r.status='disetujui';r.setujuOleh=ui.user.nama;r.setujuTs=Date.now();commit();return}
    case 'lemburTolak':{const r=(S.lembur||[]).find(x=>x.id===d.id);if(!r||!can('lemburKelola')||r.status!=='menunggu')return;r.status='ditolak';r.setujuOleh=ui.user.nama;r.setujuTs=Date.now();commit();return}
    case 'lemburHapus':{
      const r=(S.lembur||[]).find(x=>x.id===d.id);if(!r)return;
      const milik=r.userId===ui.user.id&&r.status==='menunggu';
      if(!(milik||(can('lemburKelola')&&!r.dibayar)))return;
      if(ui.confirm!=='lh'+r.id){ui.confirm='lh'+r.id;render();return}
      S.lembur=S.lembur.filter(x=>x.id!==r.id);ui.confirm=null;commit();return}
    case 'lemburBayar':{
      if(!can('lemburKelola'))return;
      const key='lb'+d.id;if(ui.confirm!==key){ui.confirm=key;render();return}
      const b=ui.lBulan===undefined?bulanIni():ui.lBulan;let n=0,tot=0;
      (S.lembur||[]).forEach(r=>{if(r.userId===d.id&&r.status==='disetujui'&&!r.dibayar&&(!b||r.tgl.slice(0,7)===b)){r.dibayar=true;r.bayarTs=Date.now();r.bayarOleh=ui.user.nama;n++;tot+=r.upah}});
      ui.confirm=null;ui.notice=n?'Lembur '+n+' catatan ('+fR(tot)+') ditandai sudah dibayar.':'';commit();return}
    case 'pakai':{const j=S.jobs.find(x=>x.id===d.id);if(!j||!bisaPakai(j))return;ui.modal={t:'pakai',id:j.id};renderModal();return}
    case 'editBahan':ui.modal={t:'bahan',id:d.id};renderModal();return;
    case 'terima':ui.modal={t:'terima',id:d.id};renderModal();return;
    case 'newJudul':ui.modal={t:'judul',id:null};renderModal();return;
    case 'lemStok':ui.modal={t:'lemstok',id:d.id};renderModal();return;
    case 'editJudul':ui.modal={t:'judul',id:d.id};renderModal();return;
    case 'keluar':ui.modal={t:'sj',tipe:'gudang',sel:d.id,qty:''};renderModal();return;
    case 'sjBaru':ui.modal={t:'sj',tipe:'gudang',sel:'',qty:''};renderModal();return;
    case 'lipatSj':ui.modal={t:'sj',tipe:'lipat',sel:d.id||'',pl:d.pl||'',qty:''};renderModal();return;
    case 'sjRow':{const box=document.getElementById('sjrows');if(box)box.insertAdjacentHTML('beforeend',sjRow(d.tipe,'',''));return}
    case 'sjDel':{const row=el.closest('.sjrow');if(row&&document.querySelectorAll('.sjrow').length>1)row.remove();return}
    case 'sjLihat':ui.modal={t:'sjdoc',id:d.id};renderModal();return;
    case 'sjSalin':{
      const sj=S.suratJalan.find(x=>x.id===d.id),txt=sjTeks(sj),ta=document.getElementById('sjteks');
      const fail=()=>{ta.value=txt;ta.hidden=false;ta.select()};
      try{navigator.clipboard.writeText(txt).then(()=>{el.textContent='Tersalin'},fail)}catch(e){fail()}
      return}
    case 'newRevisi':ui.modal={t:'revisi',id:d.id||''};renderModal();return;
    case 'revSelesai':ui.modal={t:'revSelesai',id:d.id};renderModal();return;
    case 'cetakUlang':{const x=judulById(d.id);const o=buatCetakUlang(x,false);scheduleAll();ui.notice='Pesanan cetak ulang "'+x.judul+'" ('+fN(o.jumlah)+' buku) dibuat dan dijadwalkan. Estimasi selesai '+fDT(info(o).est)+'.';commit();return}
    case 'delJudul':
      if(ui.confirm!=='j'+d.id){ui.confirm='j'+d.id;renderModal();return}
      S.orders.forEach(o=>{if(o.judulId===d.id){o.judulId=null;o.masukStok=false}});
      S.judul=S.judul.filter(x=>x.id!==d.id);S.mutasi=S.mutasi.filter(m=>m.judulId!==d.id);ui.modal=null;ui.confirm=null;sinkron();commit();return;
    case 'menu':ui.modal={t:'menu'};renderModal();return;
    case 'rincianPelipat':ui.modal={t:'rincian',id:d.id};ui.confirm=null;renderModal();return;
    case 'newPelipat':ui.modal={t:'pelipat',id:null};renderModal();return;
    case 'editPelipat':ui.modal={t:'pelipat',id:d.id};renderModal();return;
    case 'delPelipat':{
      const belum=S.jobs.filter(j=>j.key==='lipat').reduce((n,j)=>n+j.laporan.filter(l=>l.pelipatId===d.id&&!l.dibayar).reduce((m,l)=>m+(l.ongkos||0),0),0);
      if(belum>0){ui.confirm=null;renderModal();const e=document.getElementById('merr');if(e)e.textContent='Pelipat ini masih punya ongkos belum dibayar ('+fR(belum)+'). Tandai dibayar dulu di menu Lipat, baru dihapus.';return}
    }
    // eslint-disable-next-line no-fallthrough
    case 'delPelipat2':
      if(ui.confirm!=='pl'+d.id){ui.confirm='pl'+d.id;renderModal();return}
      S.pelipat=S.pelipat.filter(x=>x.id!==d.id);ui.modal=null;ui.confirm=null;commit();return;
    case 'bayarPelipat':{
      if(ui.confirm!=='b'+d.id){ui.confirm='b'+d.id;render();renderModal();return}
      const p=S.pelipat.find(x=>x.id===d.id);let tot=0;
      S.jobs.filter(j=>j.key==='lipat').forEach(j=>j.laporan.forEach(l=>{if(l.pelipatId===p.id&&!l.dibayar){l.dibayar=true;l.bayarTs=Date.now();l.bayarOleh=ui.user.nama;tot+=l.ongkos||0}}));
      ui.confirm=null;ui.modal=null;ui.notice='Ongkos '+p.nama+' sebesar '+fR(tot)+' ditandai sudah dibayar.';commit();return}
    case 'reset':ui.modal={t:'reset'};renderModal();return;
  }
}
function submitForm(form){
  const t=form.dataset.form,v=Object.fromEntries(new FormData(form)),id=form.dataset.id;
  const err=m=>{const e=document.getElementById('merr');if(e)e.textContent=m;else{ui.err=m;render()}};
  if(t==='login'){
    const u=S.users.find(x=>x.username===v.username.trim()&&x.password===v.password);
    if(!u){ui.err='Nama pengguna atau kata sandi salah.';render();return}
    ui.err='';ui.user=u;ui.page=null;ui.view=null;try{sessionStorage.setItem('meja.sesi',u.id)}catch(e){}render();return;
  }
  if(t==='reset'){
    if(!ui.user||ui.user.peran!=='owner')return err('Hanya pemilik yang boleh memulihkan data contoh.');
    if(v.password!==ui.user.password)return err('Kata sandi salah.');
    const me=ui.user.username;S=seed();save();ui.user=S.users.find(u=>u.username===me)||S.users[0];ui.modal=null;ui.confirm=null;ui.notice='Data contoh dipulihkan.';render();return;

      if(dX)mutasi(x,'koreksi',dX,'Koreksi stok dari ubah judul','index');
      Object.keys(x.stokKater||{}).forEach(k=>{if(v['kater_'+k]===undefined)return;const n=nn('kater_'+k),dk=n-x.stokKater[k];x.stokKater[k]=n;if(dk)mutasi(x,'koreksi',dk,'Koreksi stok kater '+katerLabel(k),'kater')});
    }else{
      const x=Object.assign({id:nid('jd'),stok:stok,stokIsi:stokIsi,stokSampul:stokSampul,stokLem:stokLem,stokIndex:stokIndex},d);S.judul.push(x);
      if(stok>0)mutasi(x,'masuk',stok,'Stok awal','buku');
      if(stokIsi>0)mutasi(x,'masuk',stokIsi,'Stok awal','isi');
      if(stokSampul>0)mutasi(x,'masuk',stokSampul,'Stok awal','sampul');
      if(stokLem>0)mutasi(x,'masuk',stokLem,'Stok awal','lem');
      if(stokIndex>0)mutasi(x,'masuk',stokIndex,'Stok awal','index');
    }
    ui.modal=null;sinkron();commit();return;
  }
  if(t==='sj'){
    const tipe=form.dataset.tipe;
    const rows=[...form.querySelectorAll('.sjrow')].map(r=>({ref:r.querySelector('.sjref').value,qty:Math.round(+r.querySelector('.sjqty').value||0)})).filter(r=>r.ref);
    const petugas=(v.petugas||'').trim(),tujuan=(v.tujuan||'').trim();
    if(!rows.length)return err('Tambahkan minimal satu baris.');
    if(rows.some(r=>r.qty<=0))return err('Isi jumlah lebih dari 0 pada setiap baris.');
    if(!petugas)return err('Isi nama petugas yang mengambil.');
    const items=[];
    if(tipe==='gudang'){
      const sum={};rows.forEach(r=>{sum[r.ref]=(sum[r.ref]||0)+r.qty});
      for(const k in sum){const x=judulById(k);if(sum[k]>x.stok)return err('Stok "'+x.judul+'" hanya '+fN(x.stok)+' buku.')}
      const no=noSJ();
      rows.forEach(r=>{const x=judulById(r.ref);x.stok-=r.qty;items.push({sku:x.sku,judul:x.judul,jumlah:r.qty,unit:'buku'});mutasi(x,'keluar',r.qty,'Surat jalan '+no+(tujuan?' · '+tujuan:''),'buku')});
      const sj={id:nid('sj'),no,ts:Date.now(),tipe,items,petugas,tujuan,oleh:ui.user.nama};
      S.suratJalan.unshift(sj);ui.modal={t:'sjdoc',id:sj.id};sinkron();commit();return;
    }
    const pl=S.pelipat.find(x=>x.id===v.pelipatId);if(!pl)return err('Pilih pelipat tujuan.');
    rows.forEach(r=>{const j=S.jobs.find(x=>x.id===r.ref),o=order(j.orderId),x=o.judulId?judulById(o.judulId):null;j.sjKirim=(j.sjKirim||0)+r.qty;items.push({sku:x?x.sku:'-',judul:o.judul,jumlah:r.qty,unit:'lembar',ref:j.id})});
    const sj={id:nid('sj'),no:noSJ(),ts:Date.now(),tipe,items,petugas,tujuan:pl.nama,pelipatId:pl.id,oleh:ui.user.nama};
    S.suratJalan.unshift(sj);ui.modal={t:'sjdoc',id:sj.id};commit();return;
  }
  if(t==='revisi'){
    if(!v.orderId)return err('Pilih pesanan.');
    if(!(v.catatan||'').trim())return err('Isi catatan revisi.');
    S.revisi.push({id:nid('rv'),orderId:v.orderId,bagian:v.bagian,catatan:v.catatan.trim(),status:'terbuka',dibuat:Date.now(),pembuat:ui.user.nama});
    ui.modal=null;commit();return;
  }
  if(t==='revSelesai'){
    const r=S.revisi.find(x=>x.id===id);
    r.status='selesai';r.selesaiTs=Date.now();r.selesaiOleh=ui.user.nama;r.catatanSelesai=(v.catatan||'').trim();
    ui.modal=null;commit();return;
  }
  if(t==='terima'){
    const m=mat(id),q=+v.qty||0,h=+v.harga;
    if(!(q>0))return err('Isi jumlah yang diterima.');
    if(!(h>=0)||v.harga==='')return err('Isi harga per satuan (boleh 0 bila bukan pembelian).');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v.tgl||''))return err('Isi tanggal beli.');
    m.stok=Math.round((m.stok+q)*100)/100;m.harga=h;
    S.beli=S.beli||[];
    S.beli.unshift({id:nid('bl'),tgl:v.tgl,matId:m.id,nama:m.nama,satuan:m.satuan,jenis:m.jenis,qty:q,harga:h,total:Math.round(q*h),pemasok:(v.pemasok||'').trim(),faktur:(v.faktur||'').trim(),oleh:ui.user.nama,ts:Date.now()});
    ui.bBulan=v.tgl.slice(0,7);
    ui.notice='Diterima '+fN(q)+' '+m.satuan+' '+m.nama+' · '+fR(q*h)+'.';
    ui.modal=null;commit();return;
  }
  if(t==='settings'){
    const s=S.settings,hari=[1,2,3,4,5,6,0].filter(d=>v['hk_'+d]),jam={};
    if(!hari.length)return err('Pilih minimal satu hari kerja.');
    for(let d=0;d<7;d++){const a=Math.round(+v['jm_'+d]),b=Math.round(+v['js_'+d]);if(hari.includes(d)&&!(a>=0&&a<24&&b>a&&b<=24))return err('Jam selesai harus setelah jam mulai ('+HARI[d]+').');jam[d]=[isFinite(a)?a:8,isFinite(b)?b:16]}
    s.jam=jam;s.jamMulai=jam[hari[0]][0];s.jamSelesai=jam[hari[0]][1];s.waste=+v.waste||0;s.lemGram=+v.lem||0;s.tarifLembur=Math.max(0,Math.round(+v.lembur||0));s.hari=hari;
    if(v.brandNama!==undefined){
      const bn=(v.brandNama||'').trim();if(!bn)return err('Isi nama aplikasi.');
      const bi=v.brandIkon||'mark',lg=v.logoData||'';
      if(bi==='unggah'&&!lg)return err('Pilih file gambar untuk logo, atau pilih salah satu ikon.');
      s.brand={nama:bn.slice(0,40),ikon:bi,logo:lg};
    }
    URUT.filter(k=>!TAHAP[k].luarTahap).forEach(k=>{s.kapasitas[k]=Math.max(1,+v['kap_'+k]||1);s.setup[k]=Math.max(0,+v['set_'+k]||0)});
    S.jobs.forEach(j=>{if(j.status!=='selesai'&&!j.luar)j.durMin=durasi(j.key,j.qty)});
    scheduleAll();ui.notice='Pengaturan berhasil disimpan. Jadwal sudah disusun ulang.';commit();try{window.scrollTo(0,0)}catch(e){}return;
  }
}

/* ===== Event ===== */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){ui.modal=null;ui.confirm=null;renderModal();return}
  const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset,b);
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();submitForm(f)}});
function sgItems(inp){
  const q=inp.value.trim().toLowerCase(),sj=inp.dataset.sg==='sj';
  return S.judul.filter(t=>(!sj||t.stok>0)&&(!q||judulLabel(t).toLowerCase().includes(q))).slice(0,8);
}
function sgShow(inp){
  const box=inp.parentNode.querySelector('.sgl');if(!box)return;
  const q=inp.value.trim().toLowerCase(),all=S.judul.some(t=>judulLabel(t).toLowerCase()===q);
  const it=all?[]:sgItems(inp);
  box.innerHTML=it.map(t=>'<button type="button" class="sgi" data-sgid="'+t.id+'"><b>'+esc(judulLabel(t))+'</b><small>stok '+fN(t.stok)+(t.isiDus>0?' · '+packTeks(t):'')+'</small></button>').join('');
  box.hidden=!it.length;
}
function sgPick(btn){
  const w=btn.closest('.sg'),inp=w.querySelector('.sgin'),x=judulById(btn.dataset.sgid);if(!x)return;
  inp.value=judulLabel(x);w.querySelector('.sgl').hidden=true;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('change',e=>{
  if(e.target.name==='logoFile'&&e.target.files&&e.target.files[0]){
    const f=e.target.closest('form'),fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const m=128,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const d=c.toDataURL('image/png');f.elements.logoData.value=d;
      const pv=document.getElementById('logoPv');if(pv)pv.innerHTML='<img src="'+d+'" width="26" height="26" alt="" style="object-fit:contain">';
      const rd=f.querySelector('input[name=brandIkon][value=unggah]');if(rd)rd.checked=true;
    };im.src=fr.result};
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('mousedown',e=>{const b=e.target.closest&&e.target.closest('.sgi');if(b){e.preventDefault();sgPick(b)}});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('sgin'))sgShow(e.target)});
document.addEventListener('click',e=>{if(!(e.target.closest&&e.target.closest('.sg')))document.querySelectorAll('.sgl').forEach(x=>x.hidden=true)});
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('sgin')){
    const inp=e.target;
    if(inp.dataset.sg==='sj'){const x=S.judul.find(t=>t.stok>0&&judulLabel(t).toLowerCase()===inp.value.trim().toLowerCase());inp.parentNode.querySelector('.sjref').value=x?x.id:''}
    sgShow(inp);
  }
  const fj0=e.target.closest('form[data-form="order"]');
  if(fj0&&e.target.name==='judulCari'){
    const val=e.target.value.trim().toLowerCase(),E=fj0.elements;
    const x=S.judul.find(t=>judulLabel(t).toLowerCase()===val)||null;
    E.judulId.value=x?x.id:'';
    E.judul.readOnly=E.pelanggan.readOnly=E.pengarang.readOnly=E.isbn.readOnly=!!x;
    const h=document.getElementById('jdhint');
    if(h)h.textContent=x?'Cetak ulang '+judulLabel(x)+' · stok '+fN(x.stok)+' buku'+(x.isiDus>0?' ('+packTeks(x)+')':'')+'. Data buku diisi otomatis.':(val?'Tidak ada judul yang cocok, dibuat sebagai judul baru.':'Judul baru: isi data buku di bawah.');
    if(x){E.judul.value=x.judul;E.pelanggan.value=x.penerbit;E.pengarang.value=x.pengarang||'';E.isbn.value=x.isbn||'';E.ukuran.value=x.ukuran;E.halaman.value=x.halaman;E.hplb.value=x.hplb;E.ups.value=x.ups;E.bahanIsi.value=x.bahanIsi;E.bahanSampul.value=x.bahanSampul;E.jumlah.value=x.qtyUlang;E.masukStok.checked=true;if(E.bingkai)E.bingkai.value=x.bingkai?'1':''}
  }
  const f=e.target.closest('form[data-form="order"]');if(f)orderPreview(f);
  const l=e.target.closest('form[data-form="lapor"]');
  if(l&&e.target.name==='baik'){const j=S.jobs.find(x=>x.id===l.dataset.id);const st=bagiDari(j)&&l.elements.pelipatId?bagiStat(j,l.elements.pelipatId.value):null;l.elements.selesai.checked=st?st.done+(+e.target.value||0)>=st.target:j.done+(+e.target.value||0)>=j.qty}
  const tf=e.target.closest('form[data-form="terima"]');if(tf){const el=document.getElementById('tmtotal');if(el)el.textContent='Total pembelian: '+fR((+tf.elements.qty.value||0)*(+tf.elements.harga.value||0))}
  const sjf=e.target.closest('form[data-form="sj"]');
  if(sjf&&sjf.dataset.tipe==='lipat'&&e.target.name==='pelipatId'){const box=document.getElementById('sjrows');if(box)box.innerHTML=sjRowsFor(e.target.value,'')}
  if(l&&e.target.name==='pelipatId'){
    const j=S.jobs.find(x=>x.id===l.dataset.id),st=j&&bagiDari(j)?bagiStat(j,e.target.value):null;
    if(st){const pv=document.getElementById('lpv');if(pv)pv.innerHTML=bagiPvTeks(j,e.target.value);l.elements.baik.value=st.sisa;l.elements.selesai.checked=true}
  }
  if(l)ongkosPreview(l);
});
document.addEventListener('change',e=>{
  const f=e.target.closest('form[data-form="order"]');
  if(f&&e.target.name==='ukuran'){const u=UKURAN[e.target.value];f.elements.hplb.value=u.hplb;f.elements.ups.value=u.ups;orderPreview(f)}
  if(f&&(e.target.name==='isi'||e.target.name==='sampul')){const E=f.elements,sb=document.getElementById('o-sebagian'),lu=document.getElementById('o-luar');if(sb)sb.hidden=E.isi.value!=='sebagian';if(lu)lu.hidden=E.sampul.value!=='luar';orderPreview(f)}
  if(f&&e.target.name==='kater'){const k=+e.target.value,E=f.elements;if(k>0){E.halDari.value=(k-1)*HAL_KATER+1;E.halSampai.value=Math.min(k*HAL_KATER,+E.halaman.value||k*HAL_KATER);orderPreview(f)}}
  const fu=e.target.closest('form[data-form="user"]');
  if(fu&&e.target.name==='peran'){const def=MENU_BAWAAN[e.target.value]||[];fu.querySelectorAll('input[name=menu]').forEach(c=>{c.checked=def.includes(c.value)})}
  const fj=e.target.closest('form[data-form="judul"]');
  if(fj&&e.target.name==='ukuran'){const u=UKURAN[e.target.value];fj.elements.hplb.value=u.hplb;fj.elements.ups.value=u.ups}
  if(e.target.dataset.change==='bBulan'){ui.bBulan=e.target.value;render();return}
  if(e.target.dataset.change==='lBulan'){ui.lBulan=e.target.value;render();return}
  if(e.target.dataset.change==='lUser'){ui.lUser=e.target.value;render();return}
  if(e.target.dataset.change==='kBulan'){ui.kBulan=e.target.value;render();return}
  if(e.target.dataset.change==='setStart'){
    const ts=new Date(e.target.value).getTime();if(isNaN(ts))return;
    const j=S.jobs.find(x=>x.id===e.target.dataset.id);j.manual=true;j.mulai=ts;j.manualAt=ts;scheduleAll();commit();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;ui.confirm=null;renderModal()}});

/* ===== Mulai ===== */
if(GAS){S=seed();gasBoot()}else{
load();
if(cekCetakUlang()){scheduleAll();save()}
try{const sid=sessionStorage.getItem('meja.sesi');if(sid)ui.user=S.users.find(u=>u.id===sid)||null}catch(e){}
render();
}
const tick=setInterval(()=>{
  if(!ui.user||ui.modal||!S.jobs.some(jalan)||(GAS&&!sync.ready))return;
  const a=typeof document.activeElement!=='undefined'?document.activeElement:null;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  scheduleAll();save();
  if(!(ui.page==='jadwal'&&ui.view==='timeline'))render();
},60000);
if(tick&&tick.unref)tick.unref();
if(typeof matchMedia!=='undefined')matchMedia('(max-width:700px)').addEventListener('change',()=>{ui.view=null;render()});
</script>
